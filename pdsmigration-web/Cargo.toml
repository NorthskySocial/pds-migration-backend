[package]
name = "pdsmigration-web"
version.workspace = true
edition.workspace = true
include = [
    "**/*.rs",
    "Cargo.toml",
]
license.workspace = true
repository.workspace = true

[[bin]]
name = "pdsmigration-web"
path = "src/main.rs"

[lib]
name = "pdsmigration_web"
path = "src/lib.rs"
doctest = false

[dependencies]
dotenvy = "0.15.7"
actix-rt = "2.11.0"
actix-web = { version = "4.14.1", default-features = false, features = ["macros"] }
bsky-sdk = { workspace = true }
tracing-actix-web = "0.7.22"
pdsmigration-common = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
actix-web-prom = "0.10.0"
derive_more = { workspace = true }
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "debug-embed"] }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2.11.0"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = { workspace = true }
